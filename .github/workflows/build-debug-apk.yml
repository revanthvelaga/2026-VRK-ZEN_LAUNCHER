name: Build debug APK

# Skips Android Studio entirely: push code, GitHub Actions builds the debug
# APK and publishes it to the "latest-debug" release, so the newest build is
# always one tap away on the phone (no zip, no login — the repo is public):
#   https://github.com/revanthvelaga/2026-VRK-ZEN_LAUNCHER/releases/download/latest-debug/ZenFold-debug.apk
# It's also kept as a run artifact. Install it on your phone (Settings will warn about "unknown sources" the first
# time — that's expected for a sideloaded debug build). Android SDK packages
# and Gradle dependencies are both cached, so builds after the first one
# only re-download what actually changed.
on:
  push:
    branches: ["**"]
  workflow_dispatch:

concurrency:
  group: build-debug-apk-${{ github.ref }}
  cancel-in-progress: true

# Publishing the release below needs write access to tags and releases.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # actions/cache's `with.path` can't read the runner's process env directly, only
      # the workflow `env` context -- so promote ANDROID_HOME into it first.
      - name: Export Android SDK path
        run: echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"

      # Scoped to the exact version dirs sdkmanager installs below, not the whole
      # platforms/build-tools trees -- those also hold every version the runner image
      # ships preinstalled, and caching all of it made the cache-save step crawl.
      # Bump this key alongside the versions below when either changes.
      - name: Cache Android SDK packages
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.ANDROID_HOME }}/platforms/android-34
            ${{ env.ANDROID_HOME }}/build-tools/34.0.0
          key: android-sdk-platform34-buildtools34.0.0

      # GitHub's ubuntu-latest runner already ships an Android SDK at $ANDROID_HOME —
      # android-actions/setup-android tries to install the long-removed legacy "tools"
      # package and fails outright, so we drive sdkmanager from that SDK directly instead.
      # compileSdk in app/build.gradle.kts — bump the platform/build-tools below (and the
      # cache key above) alongside it.
      - name: Accept SDK licenses and install required packages
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -name sdkmanager -type f | sort -V | tail -n1)"
          echo "Using sdkmanager at $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null
          "$SDKMANAGER" --install "platforms;android-34" "build-tools;34.0.0"

      # Read-write here even off the default branch: this repo's real work happens on
      # feature branches, and there's no shared/public cache to worry about polluting.
      - name: Cache Gradle dependencies
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Test and build debug APK
        run: ./gradlew testDebugUnitTest assembleDebug --no-daemon --stacktrace

      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zenfold-unit-test-results
          path: app/build/test-results/testDebugUnitTest/
          if-no-files-found: ignore

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: zenfold-launcher-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # One rolling pre-release whose tag moves to each new build, so the download link
      # above never changes. (Tag pushes don't match `on.push.branches`, and pushes made
      # with GITHUB_TOKEN never start workflows, so this can't trigger itself.)
      - name: Publish APK to the latest-debug release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk ZenFold-debug.apk
          git tag -f latest-debug
          git push -f origin refs/tags/latest-debug
          notes="Newest debug build (version 1.0.${GITHUB_RUN_NUMBER}, ${GITHUB_SHA::7} on ${GITHUB_REF_NAME}). Download ZenFold-debug.apk below and open it on your phone to install."
          if gh release view latest-debug > /dev/null 2>&1; then
            gh release edit latest-debug --prerelease --title "Latest debug build" --notes "$notes"
          else
            gh release create latest-debug --prerelease --title "Latest debug build" --notes "$notes"
          fi
          gh release upload latest-debug ZenFold-debug.apk --clobber
