name: Validate dialer design
on:
  pull_request:
    branches: [ "feature/vrk-dialer" ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Compile, lint and exercise dialer UI
        run: gradle assembleDebug lintDebug testDebugUnitTest --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: VRK-Phone-design-review
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/design/*.png
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
