name: Build Dialer APK

on:
  push:
    branches: [ "feature/vrk-dialer" ]
  workflow_dispatch:

permissions:
  contents: write   # needed to publish the APK as a release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # No wrapper jar needed in the repo — Actions installs Gradle directly
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Validate and build debug APK
        run: gradle assembleDebug lintDebug testDebugUnitTest --stacktrace

      # Full console output (see build.gradle.kts) usually says enough; this is the fallback
      # when it doesn't — the same HTML a local `gradle test` run would open.
      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-${{ github.run_number }}
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk VRK-Dialer-${{ github.run_number }}.apk

      - name: Upload as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: VRK-Dialer-${{ github.run_number }}
          path: VRK-Dialer-${{ github.run_number }}.apk

      # Direct download link you can open on your phone
      - name: Publish pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dialer-build-${{ github.run_number }}
          name: VRK Dialer build ${{ github.run_number }}
          prerelease: true
          target_commitish: ${{ github.sha }}
          files: VRK-Dialer-${{ github.run_number }}.apk

      # One fixed link that always has the newest build (the per-build releases above stay).
      - name: Update dialer-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp VRK-Dialer-${{ github.run_number }}.apk VRK-Dialer.apk
          git tag -f dialer-latest
          git push -f origin refs/tags/dialer-latest
          notes="Newest VRK Dialer build (0.4.${GITHUB_RUN_NUMBER}, ${GITHUB_SHA::7}). Download VRK-Dialer.apk and open it on your phone."
          if gh release view dialer-latest > /dev/null 2>&1; then
            gh release edit dialer-latest --prerelease --title "VRK Dialer — latest" --notes "$notes"
          else
            gh release create dialer-latest --prerelease --title "VRK Dialer — latest" --notes "$notes"
          fi
          gh release upload dialer-latest VRK-Dialer.apk --clobber
